STOP_LOOP = False


def log(msg: str, level: str = "INFO") -> None:
    ts = time.strftime("%Y-%m-%d %H:%M:%S", time.localtime())
    line = f"[{ts}] [{level}] {msg}"
    try:
        with LOG_FILE.open("a", encoding="utf-8") as fh:
            fh.write(line + "\n")
    except Exception:
        pass
    print(line)


def signal_handler(signum, frame):
    global STOP_LOOP
    STOP_LOOP = True
    log("Shutdown requested. Cleaning up...", "WARNING")


signal.signal(signal.SIGINT, signal_handler)
signal.signal(signal.SIGTERM, signal_handler)


def is_valid_ip(value: str) -> bool:
    try:
        socket.inet_aton(value)
        return True
    except OSError:
        return False


def safe_request(url: str, timeout: int = 20, retries: int = 3) -> Optional[requests.Response]:
    last_error = None
    for attempt in range(1, retries + 1):
        try:
            response = requests.get(url, timeout=timeout)
            if response.status_code == 200:
                return response
            last_error = RuntimeError(f"HTTP {response.status_code}")
        except requests.RequestException as exc:
            last_error = exc
        if attempt < retries:
            time.sleep(1)
    if last_error:
        log(f"Request failed for {url}: {last_error}", "ERROR")
    return None


def require_root() -> None:
    if os.geteuid() != 0:
        raise PermissionError("This tool must be run as root: sudo python3 tor_location_manager.py")


def ensure_directories() -> None:
    DATA_DIR.mkdir(parents=True, exist_ok=True)
    LOG_FILE.touch(exist_ok=True)
    TORRC_DIR.mkdir(parents=True, exist_ok=True)
    os.chmod(DATA_DIR, 0o700)


def ensure_tor_installed() -> None:
    if not shutil.which("tor"):
        raise FileNotFoundError("Tor is not installed. Run: sudo apt install -y tor")


def ensure_systemd_state() -> None:
    for cmd in [
        ["systemctl", "enable", "tor"],
        ["systemctl", "restart", "tor"],
    ]:
        try:
            subprocess.run(cmd, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
        except Exception:
            pass


def ensure_torrc() -> None:
    if not TORRC_PATH.exists():
        TORRC_PATH.write_text("", encoding="utf-8")

    if "Include /etc/tor/torrc.d/*.conf" not in TORRC_PATH.read_text(encoding="utf-8", errors="ignore"):
        with TORRC_PATH.open("a", encoding="utf-8") as fh:
            fh.write("\nInclude /etc/tor/torrc.d/*.conf\n")

    if not TORRC_OVERRIDE.exists():
        TORRC_OVERRIDE.write_text(
            "# Managed by tor-location-manager\n"
            "ControlPort 9051\n"
            "CookieAuthentication 1\n"
            "CookieAuthFileGroupReadable 1\n"
            "SOCKSPort 9050\n"
            "SOCKSPort 127.0.0.1:9050\n",
            encoding="utf-8",
        )
        os.chmod(TORRC_OVERRIDE, 0o644)


def backup_file(path: Path) -> None:
    if path.exists():
        backup = path.with_suffix(path.suffix + ".bak")
        try:
            backup.write_bytes(path.read_bytes())
            log(f"Backed up {path} to {backup}", "INFO")
        except Exception as exc:
            log(f"Failed to back up {path}: {exc}", "ERROR")


def restart_tor() -> None:
    for cmd in (
        ["systemctl", "restart", TOR_SERVICE],
        ["service", TOR_SERVICE, "restart"],
    ):
        try:
            result = subprocess.run(cmd, check=False, capture_output=True, text=True)
            if result.returncode == 0:
                log(f"Restarted Tor via: {' '.join(cmd)}", "INFO")
                return
        except Exception as exc:
            log(f"Failed to restart Tor via {' '.join(cmd)}: {exc}", "ERROR")
    raise RuntimeError("Unable to restart Tor service")


def is_tor_control_active() -> bool:
    try:
        with socket.create_connection(("127.0.0.1", CONTROL_PORT), timeout=3):
            return True
    except OSError:
        return False


def get_tor_cookie() -> Optional[Path]:
    candidates = [
        Path("/var/run/tor/control_auth_cookie"),
        Path("/run/tor/control.authcookie"),
    ]
    for candidate in candidates:
        if candidate.exists():
            return candidate
    return None


def tor_command(command: str) -> Dict[str, Any]:
    cookie = get_tor_cookie()
    if not cookie:
        return {"ok": False, "error": "Tor control cookie not found; control authentication is unavailable"}

    try:
        sock = socket.create_connection(("127.0.0.1", CONTROL_PORT), timeout=5)
    except OSError as exc:
        return {"ok": False, "error": str(exc)}

    try:
        auth_data = cookie.read_bytes()
        if auth_data:
            sock.sendall(b"AUTHENTICATE " + auth_data.hex().encode("ascii") + b"\r\n")
            try:
                response = sock.recv(4096)
            except socket.timeout:
                response = b""
            if b"250" not in response:
                pass

        sock.sendall(f"{command}\r\n".encode("utf-8"))
        chunks = []
        while True:
            try:
                data = sock.recv(4096)
                if not data:
                    break
                chunks.append(data)
                if b"250" in data:
                    break
            except socket.timeout:
                break

        raw = b"".join(chunks)
        return {"ok": True, "response": raw.decode("utf-8", errors="replace")}
    except Exception as exc:
        return {"ok": False, "error": str(exc)}
    finally:
        sock.close()


def scrape_exit_data() -> List[Dict[str, Any]]:
    url = "https://onionoo.torproject.org/details?type=relay&running=true&flag=Exit"
    resp = safe_request(url, timeout=25, retries=3)
    if not resp:
        return []

    try:
        payload = resp.json()
    except ValueError:
        log("Scraper: invalid JSON from Onionoo", "ERROR")
        return []

    relays = payload.get("relays", [])
    entries: List[Dict[str, Any]] = []

    for relay in relays:
        country = relay.get("country") or "unknown"
        flag_list = relay.get("flags") or []
        if "Exit" not in flag_list and "Exit" not in str(relay):
            continue

        exit_addresses = relay.get("exit_addresses") or []
        or_addresses = relay.get("or_addresses") or []

        ip_candidates: List[str] = []
        for address in exit_addresses + or_addresses:
            if not isinstance(address, str):
                continue
            ip = address.split(":")[0].strip()
            if is_valid_ip(ip):
                ip_candidates.append(ip)

        if not ip_candidates:
            continue

        region = relay.get("region_name") or "unknown"
        city = relay.get("city_name") or "unknown"
        tz = relay.get("timezone") or "unknown"

        record = {
            "country_code": country.upper(),
            "country": COUNTRY_NAME_MAP.get(country.upper(), country),
            "region": region,
            "city": city,
            "timezone": tz,
            "ip": ip_candidates[0],
            "ips": list(dict.fromkeys(ip_candidates))[:10],
            "nickname": relay.get("nickname") or "unknown",
            "fingerprint": relay.get("fingerprint") or "unknown",
            "last_seen": relay.get("last_seen") or "unknown",
            "source": "onionoo",
        }
        entries.append(record)

    unique: Dict[str, Dict[str, Any]] = {}
    for item in entries:
        key = f"{item['country_code']}:{item['region']}:{item['city']}:{item['ip']}"
        unique.setdefault(key, item)

    results = list(unique.values())
    results.sort(key=lambda x: (x["country_code"], x["region"], x["city"], x["ip"]))
    return results


def save_scraped_data(entries: List[Dict[str, Any]]) -> None:
    payload = {
        "scraped_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
        "entries": entries,
    }
    DATA_FILE.write_text(json.dumps(payload, indent=2), encoding="utf-8")
    log(f"Saved {len(entries)} Tor exit entries to {DATA_FILE}", "INFO")


def load_scraped_data() -> List[Dict[str, Any]]:
    if not DATA_FILE.exists():
        raise FileNotFoundError(f"No saved Tor data at {DATA_FILE}. Run option 1 first.")
    try:
        payload = json.loads(DATA_FILE.read_text(encoding="utf-8"))
        return payload.get("entries", [])
    except json.JSONDecodeError as exc:
        raise ValueError(f"Saved Tor data is corrupted: {exc}") from exc


def validate_tor_connection() -> Dict[str, Any]:
    curl_cmd = [
        "curl",
        "--silent",
        "--show-error",
        "--max-time",
        "20",
        "--socks5-hostname",
        f"127.0.0.1:{SOCKS_PORT}",
        "https://check.torproject.org/api/ip",
    ]
    try:
        completed = subprocess.run(curl_cmd, capture_output=True, text=True, check=False)
        if completed.returncode != 0:
            return {"ok": False, "message": completed.stderr.strip() or "curl failed"}
        output = completed.stdout.strip()
        if not output:
            return {"ok": False, "message": "No data returned from Tor check endpoint"}
        try:
            data = json.loads(output)
            ip = data.get("IP") or data.get("ip") or output
            return {"ok": True, "ip": ip, "raw": output}
        except json.JSONDecodeError:
            return {"ok": True, "ip": output, "raw": output}
    except FileNotFoundError:
        return {"ok": False, "message": "curl is not installed"}


def apply_country_selection(record: Dict[str, Any]) -> None:
    country_code = (record.get("country_code") or "").upper()
    if not country_code or country_code == "UNKNOWN":
        raise ValueError("Selected record does not contain a valid country code.")

    backup_file(TORRC_OVERRIDE)
    content = (
        "# Managed by tor-location-manager\n"
        f"ExitNodes {{{country_code}}}\n"
        "StrictNodes 1\n"
        "ControlPort 9051\n"
        "CookieAuthentication 1\n"
        "CookieAuthFileGroupReadable 1\n"
        f"SOCKSPort {SOCKS_PORT}\n"
        f"SOCKSPort 127.0.0.1:{SOCKS_PORT}\n"
    )
    TORRC_OVERRIDE.write_text(content, encoding="utf-8")
    os.chmod(TORRC_OVERRIDE, 0o644)

    try:
        restart_tor()
    except Exception as exc:
        log(f"Failed to restart Tor after applying selection: {exc}", "ERROR")
        raise

    time.sleep(3)
    validation = validate_tor_connection()
    if not validation["ok"]:
        log(f"Tor validation failed after applying selection: {validation.get('message')}", "ERROR")
    else:
        log(f"Active Tor IP after selection: {validation.get('ip')}", "INFO")


def print_saved_entries(entries: List[Dict[str, Any]]) -> None:
    if not entries:
        print("No saved entries available.")
        return
    print("\nAvailable saved Tor exit entries:")
    for index, entry in enumerate(entries, 1):
        print(
            f"{index}. country={entry.get('country_code', 'unknown')} "
            f"region={entry.get('region', 'unknown')} "
            f"city={entry.get('city', 'unknown')} "
            f"tz={entry.get('timezone', 'unknown')} "
            f"ip={entry.get('ip', 'unknown')}"
        )


def menu_scrape() -> None:
    log("Running scrape flow...", "INFO")
    entries = scrape_exit_data()
    if not entries:
        log("No exit relay data was found. The scrape completed with zero valid entries.", "ERROR")
        return
    save_scraped_data(entries)
    print_saved_entries(entries)


def menu_select() -> None:
    try:
        entries = load_scraped_data()
    except Exception as exc:
        log(str(exc), "ERROR")
        return

    print_saved_entries(entries)
    try:
        choice = input("\nChoose a saved entry number: ").strip()
    except EOFError:
        return

    if not re.fullmatch(r"\d+", choice):
        log("Invalid selection. Please enter a number.", "ERROR")
        return

    selected_index = int(choice) - 1
    if selected_index < 0 or selected_index >= len(entries):
        log("Selection out of range.", "ERROR")
        return

    selected = entries[selected_index]
    print(f"\nApplying selection: {json.dumps(selected, indent=2)}")
    apply_country_selection(selected)


def rotate_identity_loop(interval_seconds: int = 120) -> None:
    log(f"Tor identity rotation started. Rotation interval: {interval_seconds} seconds.", "INFO")
    while not STOP_LOOP:
        response = tor_command("SIGNAL NEWNYM")
        if response["ok"]:
            log("Issued NEWNYM to Tor control port.", "INFO")
        else:
            log(f"NEWNYM failed: {response.get('error', 'unknown error')}", "ERROR")

        validation = validate_tor_connection()
        if validation["ok"]:
            log(f"Current Tor IP after rotation: {validation.get('ip')}", "INFO")
        else:
            log(f"Validation failed after rotation: {validation.get('message')}", "ERROR")

        for _ in range(interval_seconds):
            if STOP_LOOP:
                break
            time.sleep(1)


def show_menu() -> None:
    print("\n=============================")
    print("Tor Location Manager")
    print("=============================")
    print("1) Scrape Tor exit data and save")
    print("2) Select a saved location and apply it")
    print("3) Rotate Tor identity every 2 minutes")
    print("4) Exit")
    print("=============================")

    try:
        choice = input("Select an option: ").strip()
    except EOFError:
        return

    if choice == "1":
        menu_scrape()
    elif choice == "2":
        menu_select()
    elif choice == "3":
        rotate_identity_loop(120)
    elif choice == "4":
        raise SystemExit(0)
    else:
        log("Invalid menu option.", "ERROR")


def main() -> None:
    try:
        require_root()
        ensure_directories()
        ensure_tor_installed()
        ensure_torrc()
        ensure_systemd_state()

        if not is_tor_control_active():
            log("Tor control port 9051 is not accepting connections. Restarting Tor...", "WARNING")
            restart_tor()
            time.sleep(2)

        while True:
            show_menu()

    except KeyboardInterrupt:
        log("Interrupted by user.", "WARNING")
        sys.exit(0)
    except Exception as exc:
        log(f"Fatal error: {exc}", "ERROR")
        sys.exit(1)


if __name__ == "__main__":
    main()
