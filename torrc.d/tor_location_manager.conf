#!/usr/bin/env python3
"""
tor-location-manager
Robust Tor exit-country selector and identity rotator.
Designed for authorized Kali Linux use.
"""

import json
import os
import re
import shutil
import signal
import socket
import subprocess
import sys
import time
from pathlib import Path
from typing import Any, Dict, List, Optional

import requests

APP_NAME = "tor-location-manager"
APP_VERSION = "1.0.0"

DATA_DIR = Path.home() / ".tor-location-manager"
DATA_FILE = DATA_DIR / "tor_exit_locations.json"
LOG_FILE = DATA_DIR / "tor_location_manager.log"

TORRC_PATH = Path("/etc/tor/torrc")
TORRC_DIR = Path("/etc/tor/torrc.d")
TORRC_OVERRIDE = TORRC_DIR / "tor_location_manager.conf"
CONTROL_PORT = 9051
SOCKS_PORT = 9050
TOR_SERVICE = "tor"

